spring:
  application:
    name: CampusConnect

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campusconnect}
    username: ${DB_USERNAME:campusconnect}
    password: ${DB_PASSWORD:campusconnect_dev_password}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: UTC

server:
  port: ${PORT:${SERVER_PORT:8080}}

springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.campusconnect: INFO

application:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:86400000}

campusconnect:
  sheets:
    enabled: ${SHEET_SYNC_ENABLED:false}
    url: ${SHEET_CSV_URL:}
    source: ${SHEET_SOURCE:}
    interval-ms: ${SHEET_SYNC_INTERVAL_MS:1800000}
    initial-delay-ms: ${SHEET_SYNC_INITIAL_DELAY_MS:30000}
