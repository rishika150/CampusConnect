spring:
  application:
    name: CampusConnect

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campusconnect}
    username: ${DB_USERNAME:campusconnect}
    password: ${DB_PASSWORD:campusconnect_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.campusconnect: INFO