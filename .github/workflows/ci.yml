name: CampusConnect CI

on:
  push:
    branches: [main, "improve/**"]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: campusconnect_test
          POSTGRES_USER: campusconnect
          POSTGRES_PASSWORD: campusconnect_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campusconnect -d campusconnect_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DB_URL: jdbc:postgresql://localhost:5432/campusconnect_test
      DB_USERNAME: campusconnect
      DB_PASSWORD: campusconnect_test_password
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Validate CI JWT secret exists
        run: test -n "$JWT_SECRET" || (echo "Set CI_JWT_SECRET (Base64 key, 32+ bytes) in repository Actions secrets" && exit 1)
      - run: chmod +x mvnw && ./mvnw -B clean verify
